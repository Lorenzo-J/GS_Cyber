# HUB/gateway (nuvem do projeto). Segmentos: ops (10.20.0.0/24: operadores .50, painel .10, ingest .20), db (10.40.0.0/24), vpn (10.200.0.0/24: peers WireGuard).
# Politica padrao DROP. A regra IoT->broker pertence ao NO DE BORDA (vpn/nftables_edge.conf), nao ao hub.
table inet va {
  set mgmt_ips { type ipv4_addr; elements = { 10.200.0.100 } }
  chain input {
    type filter hook input priority 0; policy drop;
    ct state established,related accept
    iif "lo" accept
    udp dport 51820 accept                                  # UNICA porta aberta para a internet: WireGuard
    ip saddr @mgmt_ips tcp dport { 22, 8443 } accept        # SSH/painel admin somente vindo do peer administrativo da VPN
    log prefix "va-drop-in: " counter drop
  }
  chain forward {
    type filter hook forward priority 0; policy drop;
    ct state established,related accept
    ip saddr 10.200.0.11 ip daddr 10.20.0.20 tcp dport 8090 accept     # borda (VPN) -> ingest, e so isso
    ip saddr 10.20.0.10 ip daddr 10.40.0.5 tcp dport 5432 accept       # painel -> banco (unico caminho ao banco)
    ip saddr @mgmt_ips accept comment "admin via VPN"
    log prefix "va-drop-fwd: " counter drop
  }
}
