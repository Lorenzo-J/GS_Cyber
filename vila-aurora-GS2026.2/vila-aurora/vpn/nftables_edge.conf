# NO DE BORDA (por espaco comunitario). NAO TESTADO COM TRAFEGO (so sintaxe). Segmento iot 10.10.0.0/24; o broker roda neste no (10.10.0.1).
table inet va_edge {
  chain input {
    type filter hook input priority 0; policy drop;
    ct state established,related accept
    iif "lo" accept
    ip saddr 10.10.0.0/24 tcp dport 8883 accept             # IoT -> broker MQTT (mTLS) e nada mais
    ip saddr 10.200.0.100 tcp dport 22 accept               # administracao somente via VPN
    log prefix "va-edge-drop: " counter drop
  }
  chain forward { type filter hook forward priority 0; policy drop; }   # IoT nao alcanca ops/admin
}
