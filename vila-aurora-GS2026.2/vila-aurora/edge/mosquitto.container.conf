# Broker MQTT local do no de borda (UBS). mTLS obrigatorio, identidade = CN do certificado.
per_listener_settings true
listener 8883 0.0.0.0
allow_anonymous false
cafile   /pki/ca.crt
certfile /pki/devices/edge-ubs.crt
keyfile  /pki/devices/edge-ubs.key
crlfile  /pki/crl.pem
require_certificate true
use_identity_as_username true
tls_version tlsv1.2
acl_file /mosquitto/config/acl.conf
log_dest stdout
log_type all
connection_messages true
